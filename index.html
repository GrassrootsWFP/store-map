<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Where to Buy</title>
<link rel="icon" href="favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root { --ink: #111; --paper: #fafafa; --line: #d9d9d9; --soft: #666; --chip: #fff; --hi: #f0ece4; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body { background: var(--paper); color: var(--ink); font: 14px/1.45 Montserrat, system-ui, sans-serif; display: flex; flex-direction: column; }
  .bar { padding: 12px 16px 8px; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
  form.find { display: flex; gap: 8px; flex-wrap: wrap; }
  .q { flex: 1 1 220px; position: relative; }
  .q input { width: 100%; font: inherit; padding: 10px 34px 10px 12px; border: 1px solid var(--ink); border-radius: 0; background: #fff; color: var(--ink); }
  .q input::-webkit-search-cancel-button { -webkit-appearance: none; display: none; }
  .q button.clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); border: 0; background: none; font: inherit; font-size: 16px; padding: 6px 8px; cursor: pointer; color: var(--soft); }
  button.go, button.near { font: inherit; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; font-size: 12px; padding: 10px 16px; border: 1px solid var(--ink); cursor: pointer; }
  button.go { background: var(--ink); color: #fff; }
  button.near { background: #fff; color: var(--ink); }
  .chips { display: flex; gap: 6px; flex-wrap: wrap; }
  .chips button { font: inherit; font-size: 12px; padding: 6px 10px; border: 1px solid var(--line); background: var(--chip); color: var(--ink); border-radius: 999px; cursor: pointer; }
  .chips button[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }
  .status { font-size: 12px; color: var(--soft); min-height: 1.2em; }
  .main { flex: 1; display: flex; min-height: 0; }
  #list { width: 340px; overflow-y: auto; border-right: 1px solid var(--line); background: #fff; }
  #map { flex: 1; min-height: 300px; background: #eee; }
  .store { padding: 12px 16px; border-bottom: 1px solid var(--line); cursor: pointer; }
  .store:hover, .store.on { background: var(--hi); }
  .store h3 { margin: 0; font-size: 14px; font-weight: 600; }
  .store .where { color: var(--soft); font-size: 12px; }
  .store .has { font-size: 12px; margin-top: 4px; }
  .store a { color: var(--ink); font-size: 12px; font-weight: 600; }
  .km { float: right; font-size: 12px; color: var(--soft); font-weight: 500; }
  .empty { padding: 16px; color: var(--soft); }
  .leaflet-popup-content { font: 13px/1.45 Montserrat, system-ui, sans-serif; margin: 12px 14px; }
  .leaflet-popup-content h3 { margin: 0 0 2px; font-size: 14px; }
  .leaflet-popup-content a { color: var(--ink); font-weight: 600; }
  .pin { width: 16px; height: 16px; border-radius: 50%; background: var(--ink); border: 3px solid #fff; box-shadow: 0 0 0 1px var(--ink); }
  .pin.farm { background: #8a5a2b; }
  .pin.on { width: 22px; height: 22px; margin: -3px 0 0 -3px; }
  .you { width: 14px; height: 14px; border-radius: 50%; background: #2a6fdb; border: 3px solid #fff; box-shadow: 0 0 0 1px #2a6fdb; }
  @media (max-width: 700px) {
    .main { flex-direction: column-reverse; }
    #map { flex: none; height: 44vh; }
    #list { width: auto; flex: 1; border-right: 0; border-top: 1px solid var(--line); }
    .chips { flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin: 0 -16px; padding: 0 16px; }
    .chips button { flex: none; }
  }
</style>
</head>
<body>
<div class="bar">
  <form class="find" id="find">
    <div class="q"><input id="q" type="search" placeholder="Town, postal code or store" aria-label="Town, postal code or store" autocomplete="off"><button type="button" class="clear" id="clear" aria-label="Clear" hidden>✕</button></div>
    <button class="go" type="submit">Search</button>
    <button class="near" type="button" id="near">Near me</button>
  </form>
  <div class="chips" id="chips" role="group" aria-label="Show stores that carry"></div>
  <div class="status" id="status" aria-live="polite"></div>
</div>
<div class="main">
  <div id="list"></div>
  <div id="map"></div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script>
(function () {
  var data = { products: [], stores: [] }, picked = new Set(), origin = null, matchIds = null, youMarker = null, markers = [];
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var norm = function (s) { return String(s || '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’']/g, "'"); };
  var map = L.map('map', { scrollWheelZoom: false }).setView([43.7, -81.1], 8);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 18, attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>' }).addTo(map);
  window.addEventListener('resize', function () { map.invalidateSize(); });
  map.on('focus', function () { map.scrollWheelZoom.enable(); });
  map.on('blur', function () { map.scrollWheelZoom.disable(); });

  function km(a, b) {
    var R = 6371, r = Math.PI / 180, dLat = (b.lat - a.lat) * r, dLng = (b.lng - a.lng) * r;
    var h = Math.sin(dLat / 2) * Math.sin(dLat / 2) + Math.cos(a.lat * r) * Math.cos(b.lat * r) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 2 * R * Math.asin(Math.sqrt(h));
  }
  function names(keys) { return data.products.filter(function (p) { return keys.indexOf(p.key) >= 0; }).map(function (p) { return p.name; }).join(' · '); }
  function directions(s) { return 'https://www.google.com/maps/dir/?api=1&destination=' + encodeURIComponent(s.name + ', ' + s.address); }
  function popup(s) {
    return '<h3>' + esc(s.name) + '</h3><div>' + esc(s.address) + '</div><div style="margin:6px 0">' + esc(names(s.products)) + '</div>' +
      '<a href="' + directions(s) + '" target="_blank" rel="noopener">Directions ↗</a>';
  }

  function shown() {
    var list = data.stores.filter(function (s) {
      if (matchIds && !matchIds.has(s)) return false;
      for (var k of picked) if (s.products.indexOf(k) < 0) return false;
      return true;
    });
    if (origin) {
      list.forEach(function (s) { s.km = km(origin, s); });
      list.sort(function (a, b) { return a.km - b.km; });
    } else {
      list.forEach(function (s) { s.km = null; });
      list.sort(function (a, b) { return (b.farm ? 1 : 0) - (a.farm ? 1 : 0) || a.name.localeCompare(b.name); });
    }
    return list;
  }

  function draw(fit) {
    var list = shown();
    markers.forEach(function (m) { m.remove(); });
    markers = list.map(function (s) {
      var m = L.marker([s.lat, s.lng], { icon: L.divIcon({ className: '', html: '<div class="pin' + (s.farm ? ' farm' : '') + '"></div>', iconSize: [16, 16], iconAnchor: [8, 8] }), title: s.name, keyboard: true })
        .bindPopup(popup(s)).addTo(map);
      m.store = s;
      return m;
    });
    $('list').innerHTML = list.length ? list.map(function (s, i) {
      return '<div class="store" tabindex="0" role="button" data-i="' + i + '">' + (s.km != null ? '<span class="km">' + (s.km < 10 ? s.km.toFixed(1) : Math.round(s.km)) + ' km</span>' : '') +
        '<h3>' + esc(s.name) + '</h3><div class="where">' + esc(s.address) + '</div><div class="has">' + esc(names(s.products)) + '</div>' +
        '<a href="' + directions(s) + '" target="_blank" rel="noopener">Directions ↗</a></div>';
    }).join('') : '<div class="empty">No stores match. Try a different town, or fewer products.</div>';
    if (fit && list.length) {
      var pts = (origin ? list.slice(0, 5) : list).map(function (s) { return [s.lat, s.lng]; });
      if (origin) pts.push([origin.lat, origin.lng]);
      map.fitBounds(pts, { padding: [30, 30], maxZoom: 12 });
    }
  }
  function focusStore(i) {
    var m = markers[i]; if (!m) return;
    document.querySelectorAll('.store.on').forEach(function (e) { e.classList.remove('on'); });
    var el = document.querySelector('.store[data-i="' + i + '"]'); if (el) el.classList.add('on');
    map.setView(m.getLatLng(), Math.max(map.getZoom(), 12)); m.openPopup();
  }
  $('list').addEventListener('click', function (e) {
    if (e.target.closest('a')) return;
    var el = e.target.closest('.store'); if (el) focusStore(Number(el.dataset.i));
  });
  $('list').addEventListener('keydown', function (e) {
    var el = e.target.closest('.store'); if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); focusStore(Number(el.dataset.i)); }
  });

  function setYou(p, label) {
    origin = p;
    if (youMarker) youMarker.remove();
    youMarker = p ? L.marker([p.lat, p.lng], { icon: L.divIcon({ className: '', html: '<div class="you"></div>', iconSize: [14, 14], iconAnchor: [7, 7] }), title: label, zIndexOffset: -100 }).addTo(map) : null;
  }
  function status(t) { $('status').textContent = t || ''; }

  async function search(text) {
    text = text.trim();
    $('clear').hidden = !text;
    matchIds = null; setYou(null);
    if (!text) { status(''); draw(true); return; }
    var q = norm(text);
    var hits = data.stores.filter(function (s) { return norm(s.name + ' ' + s.town + ' ' + s.address).indexOf(q) >= 0; });
    var isPostal = /^[a-z]\d[a-z]\s?(\d[a-z]\d)?$/i.test(text);
    if (hits.length && !isPostal) {
      matchIds = new Set(hits);
      var p0 = hits.length === 1 || hits.every(function (h) { return norm(h.town) === norm(hits[0].town); }) ? hits[0] : null;
      if (p0) { matchIds = null; setYou({ lat: p0.lat, lng: p0.lng }, text); }
      status(p0 ? 'Stores nearest ' + text : hits.length + ' stores match "' + text + '"');
      draw(true); return;
    }
    status('Looking up ' + text + '…');
    try {
      var at = null;
      if (isPostal) { // postal codes: Photon knows the first three characters too
        var f = (await (await fetch('https://photon.komoot.io/api/?limit=1&lat=43.8&lon=-81&q=' + encodeURIComponent(text.toUpperCase()))).json()).features || [];
        if (f.length && f[0].properties.country === 'Canada') at = { lat: f[0].geometry.coordinates[1], lng: f[0].geometry.coordinates[0] };
      } else {
        var j = await (await fetch('https://nominatim.openstreetmap.org/search?format=json&limit=1&countrycodes=ca&q=' + encodeURIComponent(text + ', Ontario'))).json();
        if (j.length) at = { lat: Number(j[0].lat), lng: Number(j[0].lon) };
      }
      if (!at) { status('Couldn’t find "' + text + '". Try a town name.'); draw(false); return; }
      setYou(at, text);
      status('Stores nearest ' + text);
      draw(true);
    } catch (e) { status('Couldn’t look that up just now. Try a town or store name.'); }
  }
  $('find').addEventListener('submit', function (e) { e.preventDefault(); search($('q').value); });
  $('clear').addEventListener('click', function () { $('q').value = ''; search(''); $('q').focus(); });
  $('q').addEventListener('input', function () { $('clear').hidden = !$('q').value; if (!$('q').value) search(''); });
  $('near').addEventListener('click', function () {
    if (!navigator.geolocation) { status('Your browser can’t share its location. Type your town instead.'); return; }
    status('Finding you…');
    navigator.geolocation.getCurrentPosition(function (p) {
      matchIds = null; $('q').value = ''; $('clear').hidden = true;
      setYou({ lat: p.coords.latitude, lng: p.coords.longitude }, 'You');
      status('Stores nearest you'); draw(true);
    }, function () { status('Couldn’t get your location. Type your town instead.'); }, { timeout: 10000 });
  });

  function chips() {
    $('chips').innerHTML = '<button type="button" data-k="" aria-pressed="' + (picked.size ? 'false' : 'true') + '">All products</button>' +
      data.products.map(function (p) { return '<button type="button" data-k="' + p.key + '" aria-pressed="' + picked.has(p.key) + '">' + esc(p.name) + '</button>'; }).join('');
  }
  $('chips').addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    if (!b.dataset.k) picked.clear(); else if (picked.has(b.dataset.k)) picked.delete(b.dataset.k); else picked.add(b.dataset.k);
    chips(); draw(!origin);
  });

  fetch('stores.json').then(function (r) { return r.json(); }).then(function (j) {
    data = j; chips(); map.invalidateSize();
    var want = new URLSearchParams(location.search).get('q');
    if (want) { $('q').value = want; search(want); } else draw(true);
  }).catch(function () { $('list').innerHTML = '<div class="empty">The store list couldn’t load. Please try again in a minute.</div>'; });
})();
</script>
</body>
</html>
